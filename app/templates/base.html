<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Assetly" }} - Assetly</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="mark">A</span>
      <span>Assetly</span>
    </a>

    <nav class="main-nav">
      <a href="/" class="nav-item">Home</a>
      <a href="/assets" class="nav-item">My Things</a>
      <a href="/snacks" class="nav-item">Snacks</a>
      <a href="/kitchen-grocery" class="nav-item">Kitchen &amp; Grocery</a>
      <a href="/lending" class="nav-item">Borrowing</a>
      <a href="/reports" class="nav-item">Insights</a>
      <a href="/query-lab" class="nav-item">Query Lab</a>
    </nav>

    <div class="topbar-right">
      <form class="topbar-search" action="/assets" method="get">
        <input type="search" name="q" placeholder="Search items, locations..." value="{{ q or '' }}" aria-label="Search inventory">
        <button type="submit">Search</button>
      </form>
      <span id="offline-note" class="offline-note"></span>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div>Assetly Home Inventory</div>
    <div id="sync-status"></div>
  </footer>

  <script src="/static/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
